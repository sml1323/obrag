services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      # 인증이 없으므로 호스트 외부(LAN)로 노출하지 않는다. 로컬호스트에만 바인딩.
      # 프론트엔드 컨테이너는 내부 네트워크(backend:8000)로 접근한다.
      - "127.0.0.1:8000:8000"
    volumes:
      # Obsidian vault (호스트의 vault 경로를 여기에 지정)
      - ${HOST_VAULT_PATH:-./_vault}:/data/vault:ro
      # Persistent data
      - chroma_data:/data/chroma_db
      - sqlite_data:/data
      - model_cache:/data/models
    environment:
      - VAULT_PATH=/data/vault
      - CHROMA_PATH=/data/chroma_db
      - DATABASE_PATH=/data/database.db
      - HF_HOME=/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  sqlite_data:
  model_cache:
